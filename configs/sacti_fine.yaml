# Configuration for SaCTI (Sanskrit Compound Type Identification) - Fine Labels
# Using XLM-RoBERTa encoder with DiffusionSL decoder  
# Task: Token-level compound type classification with fine-grained types

# Model Configuration
base: 'ner'
dataset: 'sacti_fine'
num_classes: 25  # Will be adjusted automatically based on data (Fine has ~15-20 types)
backbone: 'google/muril-base-cased'  # Multilingual Indic BERT
time_steps: 5000
sampling_steps: 75  # More sampling steps for fine-grained types
ddim_sampling_eta: 0.2
self_condition: True
snr_scale: 1.0  # Higher SNR to prevent mode collapse
dim_model: 768  # MURIL hidden size
dim_time: 512
depth: 10  # Deeper for more complex fine-grained classification
objective: 'pred_x0'
noise_schedule: 'cosine'
loss_type: 'l2'
compound_aware: False  # Disable for simple classification
use_graph_encoder: False  # Not needed for flat classification
add_lstm: False
freeze_bert: False
max_length: 128  # SaCTI sentences are shorter
network_architecture: 'transformer'
ensemble: False

# Contrastive Learning Configuration (disabled for baseline)
use_contrastive: False
contrastive_weight: 0.05
contrastive_temp: 0.07
contrastive_type: 'simple'

# Data Configuration
data_path: "/home/pretam-pg/SaCTI/data"  # Base path to SaCTI data
granularity: 'fine'  # Options: 'coarse' or 'fine' (lowercase)
language: 'sacti'  # Options: 'sacti', 'marathi', 'english', or 'auto'

# Training Configuration
logger: 'None'  # Options: 'wandb', 'tensorboard', 'None'
output_dir: 'saved_models/sacti_fine'
batch_size: 12  # Slightly smaller batch for more complex task
num_workers: 4
max_epochs: 70  # More epochs for fine-grained types
max_steps: 150000
warmup_steps: 1000
warmup_ratio: 0.05
optimizer_type: 'AdamW'
lr_scheduler_type: 'cosine'
lr_bert: 2e-5  # Standard BERT fine-tuning rate
lr_other: 1e-4  # Higher for decoder
weight_decay: 0.01
max_grad_norm: 1.0
accumulation_steps: 1

# GPU Configuration
use_gpu: True
gpus: 1

# Early Stopping Configuration
patience: 15  # More patience for fine-grained task
min_delta: 0.0001
