# =============================================================================
# BiAffine-Enhanced BitDit — MINIMAL change from baseline
# =============================================================================
#
# This config matches the baseline (necti_finegrain_xlmr.yaml) EXACTLY,
# with only the biaffine conditioner added.
#
# What's the same as baseline:
#   - DiT from dit_discrete.py (num_heads=8, hardcoded in ddim_bitdit.py)
#   - DDIM sampling with eta=1.0 (stochastic)
#   - Self-conditioning, cosine schedule, pred_x0 objective
#   - All hyperparameters (lr, depth, dim, etc.)
#
# What's different:
#   - BiaffineConditioner between BERT and DiT (gate starts near 0)
#
# Expected: USS should stay ≈98.71, LSS should improve beyond 86.11
# =============================================================================

# Model Configuration — IDENTICAL to baseline
base: 'ner'
dataset: 'necti_finegrain'
num_classes: 56
backbone: 'FacebookAI/xlm-roberta-large'
time_steps: 1000
sampling_steps: 100
ddim_sampling_eta: 1.0
self_condition: True
snr_scale: 2.0
dim_model: 1024
dim_time: 512
depth: 12
objective: 'pred_x0'
noise_schedule: 'cosine'
loss_type: 'l2'
add_lstm: False
freeze_bert: False
max_length: 256
network_architecture: 'transformer'
ensemble: False

# Data Configuration
data_path: '/home/pretam-pg/DepNeCTI/DepNeCTI-XLMR/Trankit_Data'
granularity: 'Finegrain'
use_context: False

# Training Configuration — IDENTICAL to baseline
logger: 'None'
output_dir: 'saved_models/necti_biaffine_minimal'
batch_size: 8
num_workers: 4
max_epochs: 30
max_steps: 250000
warmup_steps: 1000
warmup_ratio: 0.01
optimizer_type: 'AdamW'
lr_scheduler_type: 'cosine'
lr_bert: 0.00002
lr_other: 0.0005
weight_decay: 0.01
max_grad_norm: 1.0
accumulation_steps: 1
patience: 10
min_delta: 0.0001

# BiAffine-specific params (THE ONLY NEW THING)
biaffine_rank: 64
biaffine_num_heads: 8
biaffine_dropout: 0.1
biaffine_gate_init: -3.0  # sigmoid(-3) ≈ 0.05 → starts nearly identical to baseline
