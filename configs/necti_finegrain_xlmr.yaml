# Configuration for NeCTI Nested Compound Identification (Finegrain)
# Using XLM-RoBERTa encoder with DiffusionSL decoder
# Updated: Increased sampling steps and model capacity for better EM scores

# Model Configuration
base: 'ner'
dataset: 'necti_finegrain'
num_classes: 69  # Will be adjusted automatically based on data
backbone: 'xlm-roberta-base'  # XLM-R encoder
time_steps: 1000
sampling_steps: 50  # INCREASED from 10 to 50 (5x more denoising steps for 69 classes)
ddim_sampling_eta: 1.0
self_condition: True
snr_scale: 3.0  # INCREASED from 2.0 to 3.0 (stronger signal for complex task)
dim_model: 768  # XLM-R hidden size
dim_time: 512  # INCREASED from 256 for richer temporal embeddings
depth: 12  # INCREASED from 6 to 12 (match coarse model capacity despite 10x more classes)
objective: 'pred_x0'
noise_schedule: 'cosine'  # CHANGED from linear to cosine (better for more steps)
loss_type: 'l2'
add_lstm: True
freeze_bert: False
max_length: 256
network_architecture: 'transformer'
ensemble: True  # ENABLED for multiple predictions

# Data Configuration
data_path: '/home/pretam-pg/DepNeCTI/data/NeCTIS Model Data'
granularity: 'Finegrain'

# Training Configuration
logger: 'wandb'  # Options: 'wandb', 'tensorboard', 'None'
output_dir: 'saved_models/necti_finegrain'
batch_size: 8  # REDUCED from 16 due to deeper model (12 layers)
num_workers: 8  # INCREASED for better data loading
max_epochs: 50  # INCREASED from 30 for deeper model convergence
max_steps: 500000  # INCREASED from 250000 for more training
warmup_steps: 2000  # INCREASED from 1000 for stability with deeper model
warmup_ratio: 0.01
optimizer_type: 'AdamW'
lr_scheduler_type: 'cosine'  # CHANGED from linear to cosine for better convergence
lr_bert: 5e-6  # REDUCED from 2e-5 for stability with more capacity
lr_other: 3e-4  # REDUCED from 5e-4 for stability
weight_decay: 0.01
max_grad_norm: 1.0
accumulation_steps: 4  # ADDED gradient accumulation for effective batch size 32

# GPU Configuration
use_gpu: True
gpus: 1