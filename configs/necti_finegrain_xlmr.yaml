# Configuration for NeCTI Nested Compound Identification (Finegrain)
# Using XLM-RoBERTa encoder with DiffusionSL decoder
# Updated: Increased sampling steps and model capacity for better EM scores

# Model Configuration
base: 'ner'
dataset: 'necti_finegrain'
num_classes: 69  # Will be adjusted automatically based on data
backbone: 'xlm-roberta-large'  # XLM-R encoder
time_steps: 5000
sampling_steps: 50  # INCREASED from 10 to 50 for finer generation
ddim_sampling_eta: 0.2
self_condition: True
snr_scale: 0.1 # SAME as coarse model for consistency
dim_model: 1024  # XLM-R hidden size
dim_time: 512  # INCREASED from 256 for richer temporal embeddings
depth: 12  # INCREASED from 6 to 12 (match coarse model capacity despite 10x more classes)
objective: 'pred_x0'
noise_schedule: 'cosine'  # CHANGED from linear to cosine (better for more steps)
loss_type: 'l2'
add_lstm: False  # ENABLED LSTM for better sequence modeling
freeze_bert: False
max_length: 256
network_architecture: 'transformer'
ensemble: False  # ENABLED for multiple predictions

# Data Configuration
data_path: 
granularity: 'Finegrain'

# Training Configuration
logger: 'wandb'  # Options: 'wandb', 'tensorboard', 'None'
output_dir: 'saved_models/necti_finegrain'
batch_size: 8  # REDUCED from 16 due to deeper model (12 layers)
num_workers: 8  # INCREASED for better data loading
max_epochs: 200 
max_steps: 2500000  # INCREASED from 250000 for more training
warmup_steps: 10000  # INCREASED from 1000 for stability with deeper model
warmup_ratio: 0.01
optimizer_type: 'AdamW'
lr_scheduler_type: 'cosine'  # CHANGED from linear to cosine for better convergence
lr_bert: 5e-6  # REDUCED from 2e-5 for stability with more capacity
lr_other: 3e-5  # REDUCED from 5e-4 for stability
weight_decay: 0.01
max_grad_norm: 1.0
accumulation_steps: 1  # ADDED gradient accumulation for effective batch size 32

# GPU Configuration
use_gpu: True
gpus: 1

# Inference Configuration
use_cle_decoding: True  # Use Chu-Liu-Edmonds for structured decoding

# Early Stopping Configuration
patience: 8  # Number of epochs without improvement before stopping (higher for finegrain)
min_delta: 0.00005  # Minimum improvement threshold