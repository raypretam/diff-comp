base: ner_hyp
dataset: mahanama_ner_fine
backbone: google/muril-large-cased
num_classes: 77
max_length: 128
dim_model: 1024
dim_time: 256
depth: 6
time_steps: 1000
sampling_steps: 10
noise_schedule: linear
objective: pred_x0
loss_type: l2
self_condition: True
snr_scale: 0.1
ddim_sampling_eta: 1.0
add_lstm: False
freeze_bert: False
compound_aware: False
use_graph_encoder: False
use_contrastive: False
use_mst: False

# hHTM-style hyperbolic Hawkes encoder on top of BERT features
# Ref: Rao et al., LREC-COLING 2024, https://github.com/YRaoGroup/hHTM
use_hyp_encoder: True
hyp_layers: 2
hyp_num_heads: 8
hyp_curvature: 1.0
hyp_learnable_curvature: True
hyp_dropout: 0.1

# Hyperbolic hierarchical contrastive loss (uses the known fine->coarse
# label hierarchy of mahanama_ner: Person/Location/NORP/Misc/Time/O).
# Organizes token features on the Poincaré ball: same-fine pulled together,
# same-coarse siblings kept close, cross-coarse pushed apart; coarse parent
# anchors near the origin with norm-ordering (depth) entailment.
use_hyp_contrastive: True
# NOTE on scale: the diffusion loss (diff_tok) is ~0.01 while the raw
# hyperbolic contrastive loss is ~7-8, so the weight must be small to keep
# this an *auxiliary* nudge rather than the dominant objective.
# 0.001 -> contributes ~0.008, comparable to diff_tok. Tune from here.
hyp_contrastive_weight: 0.001  # key knob to tune
hyp_proj_dim: 128             # contrastive projection dim
hyp_contrastive_curvature: 1.0
hyp_temperature: 0.5
hyp_w_sibling: 1.0            # repulsion weight for same-coarse negatives
hyp_w_cross: 2.0             # repulsion weight for cross-coarse negatives (> sibling)

max_epochs: 20
batch_size: 16
lr_bert: 1e-5
lr_other: 1e-5
weight_decay: 1e-5
warmup_steps: 1000
warmup_ratio: 0
lr_scheduler_type: linear
optimizer_type: AdamW
num_workers: 2
use_gpu: True
gpus: 0
output_dir: output
logger: None
test_path: False
model_path: model.pt
save_limit: 3
